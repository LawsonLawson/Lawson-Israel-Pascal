<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Lawson Israel Pascal</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>

    <!-- PAGE CONTAINER -->
    <div class="page-container">
      
      <!-- side bar -->
      <div class="side-bar">

        <div class="profile">
          <img src="./assets/images/myAvatar.png" alt="avatar" />
          <h1>Lawson Israel Pascal</h1>
          <h2>Backend Engineer</h2>
        </div>

        <div class="tech-stack-container">
          <div class="tech-stack">
            <h3>&lt;Daily Drivers /&gt;</h3>

            <div class="icon-grid">
              <div class="icon-box">
                <img src="./assets/images/tech_track_icons/Java.svg" alt="Java" />
              </div>
              <div class="icon-box">
                <img src="./assets/images/tech_track_icons/Spring.svg" alt="SpringBoot" />
              </div>
              <div class="icon-box">
                <img src="./assets/images/tech_track_icons/PostgresSQL.svg" alt="PostgresSQL" />
              </div>
              <div class="icon-box">
                <img src="./assets/images/tech_track_icons/Postman.svg" alt="Postman" />
              </div>
              <div class="icon-box">
                <img src="./assets/images/tech_track_icons/Kotlin.svg" alt="Kotlin" />
              </div>
              <div class="icon-box">
                <img src="./assets/images/tech_track_icons/Ktor.svg" alt="Ktor" />
              </div>
              <div class="icon-box">
                <img src="./assets/images/tech_track_icons/Git.svg" alt="Git" />
              </div>
              <div class="icon-box">
                <img src="./assets/images/tech_track_icons/Docker.svg" alt="Docker" />
              </div>
            </div>
          </div>
        </div>

        <div class="sidebar-footer">
          <div class="footer-icons">
          </div>
        </div>
      </div>

      <!-- main content -->
      <div class="main-content">
        </div>
      
    </div>
  </body>
</html>
